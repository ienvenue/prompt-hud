name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Click into the message field in …
        2. Press ⌃/
        3. …
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: App you were typing in
      placeholder: e.g. Safari, Notes, VS Code, ChatGPT
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: e.g. macOS 15.3
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Prompt HUD version
      description: Menu bar icon → About Prompt HUD
